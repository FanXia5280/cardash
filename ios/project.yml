name: CarDash

options:
  bundleIdPrefix: com.cardash
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # ⚠️ 必须关掉。
    # ENABLE_USER_SCRIPT_SANDBOXING 是 Xcode 15+ 的脚本沙箱，它和 CocoaPods 已知冲突：
    # CocoaPods 靠 [CP] Embed Pods Frameworks 这个脚本阶段往 App 里拷框架，
    # 沙箱一开 rsync 就被拒（报 Sandbox: rsync deny file-write-create），
    # 表现就是日志里刷一大串 CarDash.app/Frameworks/... 然后 (N failures)。
    # 之前没有 pod 依赖所以一直没暴露。
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES

schemes:
  CarDash:
    build:
      targets:
        CarDash: all
    run:
      config: Release
    archive:
      config: Release

targets:
  CarDash:
    type: application
    platform: iOS
    sources:
      - path: CarDash
    settings:
      base:
        PRODUCT_NAME: CarDash
        PRODUCT_BUNDLE_IDENTIFIER: com.cardash.dashboard
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.6.35"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        SWIFT_OBJC_BRIDGING_HEADER: CarDash/CarDash-Bridging-Header.h
        SWIFT_COMPILATION_MODE: wholemodule
        ENABLE_BITCODE: NO
        DEAD_CODE_STRIPPING: YES
