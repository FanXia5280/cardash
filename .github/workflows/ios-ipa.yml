name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Read version
        id: ver
        working-directory: ios
        run: |
          V=$(grep -m1 'MARKETING_VERSION' project.yml | sed 's/.*"\(.*\)".*/\1/')
          echo "marketing=$V" >> "$GITHUB_OUTPUT"
          echo "版本号 = $V  (build ${{ github.run_number }})"

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install CocoaPods
        working-directory: ios
        run: |
          # 高德 SDK 只能通过 CocoaPods 拿
          gem install cocoapods --no-document || brew install cocoapods
          pod --version

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Check workspace
        working-directory: ios
        run: test -d CarDash.xcworkspace && echo "workspace OK"

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace CarDash.xcworkspace \
            -scheme CarDash \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.ver.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        working-directory: ios
        run: |
          echo "================================================================"
          echo "编译错误（error: 行）"
          echo "================================================================"
          grep -n -E "error:|fatal error:|No such module" build.log | head -60 || true
          echo ""
          echo "================================================================"
          echo "日志尾部 120 行"
          echo "================================================================"
          tail -120 build.log || true

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App bundle: $APP"
          test -n "$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../CarDash-unsigned.ipa Payload
          ls -lh ../CarDash-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarDash-unsigned-ipa
          path: ios/CarDash-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CarDash IPA ${{ steps.ver.outputs.marketing }} (build ${{ github.run_number }})
          body: |
            未签名 IPA（unsigned），用 Sideloadly / AltStore / TrollStore 自行签名安装。

            **App 版本：${{ steps.ver.outputs.marketing }} (build ${{ github.run_number }})**
            提交：${{ github.sha }}

            装完在 App 里「设置 → 版本」能看到同一个版本号，
            对得上就说明装的是这次构建。

            车机端 APK 要单独装，两个版本号互不影响：
            App 版本对不上 = IPA 是旧的；
            「桥接版本」对不上 = 车机上的 APK 是旧的。
          files: ios/CarDash-unsigned.ipa
          make_latest: true
