name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ipa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project CarDash.xcodeproj \
            -scheme CarDash \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App bundle: $APP"
          test -n "$APP"
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry ../CarDash-unsigned.ipa Payload
          ls -lh ../CarDash-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarDash-unsigned-ipa
          path: ios/CarDash-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CarDash IPA build ${{ github.run_number }}
          body: |
            未签名 IPA（unsigned），用 Sideloadly / AltStore / TrollStore 自行签名安装。

            版本：1.1.0 (build ${{ github.run_number }})
            提交：${{ github.sha }}

            本版内容：
            - 专辑封面显示（车机端把封面压成 240px JPEG base64 下发）
            - 设置页新增「车机诊断」：logcat 取数诊断 / 厂商属性扫描 / 车机运行状态 / 桥接运行日志
              车机上没有浏览器，这四个按钮可直接读，右上角「复制」能整段发出来
          files: ios/CarDash-unsigned.ipa
          make_latest: true
